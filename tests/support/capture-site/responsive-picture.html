<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Responsive picture capture</title></head>
<body>
<picture>
  <source media="(min-width: 800px)" srcset="assets/wide.svg 1x">
  <source media="(max-width: 799px)" srcset="assets/narrow.svg 1x">
  <img id="responsive-picture" src="assets/wide.svg" alt="Responsive artwork" width="120" height="60">
</picture>
</body>
</html>
